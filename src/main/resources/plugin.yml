name: ChessPlugin
main: com.wonton.chess.ChessPlugin
version: 1.0.0
# 1.13 is the lowest api-version Bukkit accepts. Servers older than 1.13 (1.8.8+) ignore this line.
api-version: '1.13'
description: 8x8 chess played in the inventory GUI
commands:
  chess:
    description: "Challenge a player (/chess <player>) or reopen your board (/chess)"
    usage: /chess <player>
    permission: chess.use
  chessaccept:
    description: Accept a chess challenge
    usage: /chessaccept
    permission: chess.use
  chessdeny:
    description: Deny a chess challenge
    usage: /chessdeny
    permission: chess.use
  chessreload:
    description: Reload the chess config
    usage: /chessreload
    permission: chess.admin
permissions:
  chess.use:
    description: Allows using the chess commands
    default: true
  chess.admin:
    description: Allows reloading the chess config
    default: op
